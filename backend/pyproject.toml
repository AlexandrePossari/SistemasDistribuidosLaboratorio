[project]
name = "backend"
version = "0.1.0"
description = "Sistemas Distribuidos - Backend"
authors = [
    {name = "Alexandre Possari"}
]
requires-python = "^3.12"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.3,<0.53.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)"
]


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
httpx2 = "^2.13.0"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "unit: testes unitarios (sem camada HTTP)",
    "integration: testes de integracao via TestClient",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
