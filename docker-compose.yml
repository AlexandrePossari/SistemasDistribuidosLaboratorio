# Nome proprio do projeto: containers, rede e volume nao se misturam com os de outros
# projetos que usem a mesma pasta (ex.: as praticas da disciplina).
name: minha-biblioteca

services:
  db:
    image: postgres:16-alpine
    container_name: biblioteca-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-biblioteca}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - biblioteca_dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-biblioteca}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: biblioteca-api
    restart: unless-stopped
    environment:
      # Dentro da rede do compose o banco e acessado pelo nome do servico: "db"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-biblioteca}
      # Origens do frontend liberadas no CORS (explicitas; "*" e recusado pela API).
      # Sem CORS_ORIGINS no .env, segue a porta publicada do frontend.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}}
      # Fuso usado para a data de conclusao ("hoje"); sem ele o container usaria UTC
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    # Aplica as migrations e sobe a API com reload (o codigo e montado como volume)
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: biblioteca-web
    restart: unless-stopped
    environment:
      # URL da API vista pelo NAVEGADOR do usuario (porta publicada da API), e nao o host
      # "api" da rede do compose: quem chama a API e o navegador, fora dos containers.
      VITE_API_URL: ${VITE_API_URL:-http://localhost:${BACKEND_PORT:-8000}}
      # Hot reload do src/ montado como volume
      VITE_WATCH_POLLING: "true"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
    healthcheck:
      # 127.0.0.1: o Vite escuta em IPv4 (0.0.0.0) e "localhost" no Alpine pode virar ::1
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Cascata: o frontend so sobe com a API saudavel, que so sobe com o banco saudavel.
    depends_on:
      api:
        condition: service_healthy

volumes:
  biblioteca_dados:
