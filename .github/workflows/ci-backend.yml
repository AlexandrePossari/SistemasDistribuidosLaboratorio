name: CI Backend

on:
  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"

jobs:
  lint:
    name: Lint e formatacao (Ruff)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v7

      - name: Instala o Poetry
        run: pipx install poetry==2.4.1

      - name: Configura o Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: poetry
          cache-dependency-path: backend/poetry.lock

      - name: Valida o poetry.lock
        run: poetry check --lock

      - name: Instala as dependencias
        run: poetry install --with dev

      - name: Verifica o lint
        run: poetry run ruff check .

      - name: Verifica a formatacao
        run: poetry run ruff format --check .

  tests:
    name: Testes (Pytest + PostgreSQL)
    runs-on: ubuntu-latest
    # Os testes so rodam se o lint e a formatacao passarem.
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: biblioteca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d biblioteca_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/biblioteca_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/biblioteca_test

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v7

      - name: Instala o Poetry
        run: pipx install poetry==2.4.1

      - name: Configura o Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: poetry
          cache-dependency-path: backend/poetry.lock

      - name: Instala as dependencias
        run: poetry install --with dev

      - name: Executa os testes unitarios
        run: poetry run pytest -v tests/unit

      - name: Aplica as migrations
        run: poetry run alembic upgrade head

      - name: Confere se os modelos e as migrations estao sincronizados
        run: poetry run alembic check

      - name: Executa os testes de integracao
        run: poetry run pytest -v tests/integration
