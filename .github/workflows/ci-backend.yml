name: CI Backend

on:
  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Instala o Poetry
        run: pipx install poetry==2.4.1

      - name: Configura o Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry
          cache-dependency-path: backend/poetry.lock

      - name: Instala as dependencias
        run: poetry install --no-root --with dev

      - name: Verifica o lint
        run: poetry run ruff check .

      - name: Verifica a formatacao
        run: poetry run ruff format --check .

  tests:
    name: Testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sistemas_distribuidos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sistemas_distribuidos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sistemas_distribuidos_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sistemas_distribuidos_test

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Instala o Poetry
        run: pipx install poetry==2.4.1

      - name: Configura o Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry
          cache-dependency-path: backend/poetry.lock

      - name: Valida o poetry.lock
        run: poetry check --lock

      - name: Instala as dependencias
        run: poetry install --no-root --with dev

      - name: Executa os testes unitarios
        run: poetry run pytest -v tests/unit

      - name: Aplica as migrations
        run: poetry run alembic upgrade head

      - name: Executa os testes de integracao
        run: poetry run pytest -v tests/integration
