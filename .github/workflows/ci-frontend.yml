name: CI Frontend

on:
  push:
    branches: ["**"]
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"

jobs:
  lint:
    name: Lint e formatacao (Biome)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v7

      - name: Configura o Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instala as dependencias
        run: npm ci

      # biome check = regras de lint + formatacao + ordem dos imports, sem alterar arquivos.
      - name: Verifica lint, formatacao e imports
        run: npm run check

  tests:
    name: Testes (Vitest + Playwright)
    runs-on: ubuntu-latest
    # Os testes so rodam se o lint e a formatacao passarem.
    needs: lint

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v7

      - name: Configura o Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instala as dependencias
        run: npm ci

      - name: Executa os testes unitarios
        run: npm run test:unit

      - name: Executa os testes de integracao
        run: npm run test:integration

      - name: Gera o build de producao
        run: npm run build

      - name: Instala o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Executa os testes E2E
        run: npm run test:e2e

      - name: Publica o relatorio do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
